# Q_Alpha v5 standalone engine configuration
# Data provider: Massive.com (ex-Polygon). Override key via MASSIVE_API_KEY.

massive_api_key: "Zs2ZeVDXsn8zS3jPO6yDDL3CDQHbaO9r"  # override with env MASSIVE_API_KEY preferred
massive_base_url: "https://api.massive.com"

start_date: "2010-01-01"
end_date: null  # null => today
initial_cash: 50000000

universe_limit: null          # ignored (legacy; do not use)
# Test mode: after full NASDAQ pull, randomly keep N active tickers for profiles/prices/funds.
# Set to null for the full universe (~4k+ active / ~11k with delisted).
universe_sample_size: 500
universe_sample_seed: 42
benchmark: QQQ

# Parallel downloaders (profiles / prices / optional fundamentals). Shared rate limiter.
# Raise workers or lower interval for more speed; back off if you see many 429s.
download_workers: 8
request_interval_sec: 0.08
max_retries: 3
# CMVS v3 does not use PIT fundamentals — leave false unless you need legacy screens.
download_fundamentals: false
# Max quarterly statements to pull per ticker from Massive financials
statement_limit: 100

max_portfolio_size: 50
selection_buffer_size: 70
# Aggressive test: raised from 0.20 (revert if MDD too high)
max_industry_weight: 0.40
min_industry_size: 8
vol_floor: 1.0e-4
weight_sum_tolerance: 0.02
lowvol_window: 60
mom_window: 252
corr_window: 60
# Aggressive test: raised from 0.80 (allow more similar names; revert if MDD too high)
corr_threshold: 0.95
flat_tax_rate: 0.21

silent_delist_recovery: 0.30
silent_delist_gap_days: 10

top_adv_pool: 250
participation_cap_buy: 0.08
participation_cap_sell: 0.15

# Trading costs deducted on every buy/sell during rebalance fills
commission_rate: 0.0005  # 0.05%
slippage_rate: 0.0002    # 0.02%

# Universe filters in get_universe (loosened; missing metrics do not reject)
min_roic: 0.03               # was 0.10 — ROIC must exceed 3% when available
min_fcf_sales_yield: -0.05   # was 0.0 — allow mildly negative FCF/Sales
max_debt_to_equity: 3.0      # was 1.50 — D/E must be below 300% when available
min_revenue_growth_yoy: -0.15  # was 0.0 — allow up to -15% YoY revenue change

# Legacy % trailing stop (unused by CMVS v3; exits use atr_multiplier / EMA9 / RSI)
# trailing_stop_pct: 0.20
atr_multiplier: 2.0        # CMVS: sell if close < peak_close - atr_multiplier * ATR(14)

# Research Configuration Panel (defaults reproduce current CMVS trade identity).
# Edit these values for experiments — no code changes required.
# ENTRY_RANK/EXIT_RANK default to max_portfolio_size / selection_buffer_size.
# Spec examples 30/80 are intentionally NOT defaults (would change baseline).
research:
  # Entry / Exit
  ENTRY_RANK: 50
  EXIT_RANK: 70

  # EMA Exit (USE_EMA9_EXIT name kept; length is configurable)
  USE_EMA9_EXIT: true
  EMA_EXIT_LENGTH: 9          # try 9 / 10 / 15 / 20 / 30

  # ATR
  USE_ATR_EXIT: true
  ATR_MULTIPLIER: 2.0

  # Exhaustion
  USE_EXHAUSTION_EXIT: true

  # Time Stop
  USE_TIME_STOP: false
  TIME_STOP_DAYS: 20

  # Holding
  MIN_HOLD_DAYS: 0

  # Portfolio
  MAX_PORTFOLIO_SIZE: 50

  # Rebalance
  MONTHLY_REBALANCE: true

  # Risk
  MAX_INDUSTRY_WEIGHT: 0.40

  # Observation tooling (does not affect trades)
  SHADOW_HORIZON_DAYS: 20

# Volatility expansion is scored in rank_universe as (close-open)/ATR20
# (vol_breakout_atr_mult kept unused; was the old hard filter threshold)
vol_breakout_atr_mult: 1.5

paths:
  prices: data/prices
  fundamentals: data/fundamentals
  metadata: data/metadata
  cache: cache
  massive_cache: cache/massive_cache
