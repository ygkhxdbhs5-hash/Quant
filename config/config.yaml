# Backtest configuration — parameters mirror the existing engine Initialize() values.
# Changing these changes behavior; keep defaults unless you intentionally re-tune.

start_date: [2007, 1, 1]
end_date: [2026, 6, 30]
initial_cash: 50000000

benchmark: QQQ

max_portfolio_size: 30
selection_buffer_size: 40
max_industry_weight: 0.20

lowvol_window: 60
mom_window: 252
corr_window: 60
corr_threshold: 0.80

min_industry_size: 8
vol_floor: 1.0e-4
weight_sum_tolerance: 0.02

universe:
  min_price: 2.0
  min_volume: 50000
  top_n: 250

rebalance:
  # Month-start, 30 minutes after QQQ open (same schedule as original engine)
  after_open_minutes: 30

paths:
  prices: data/prices
  fundamentals: data/fundamentals
  metadata: data/metadata
  cache: cache

# Slippage / fees — match original UniverseSettings
slippage:
  volume_limit: 0.10
fee_model: interactive_brokers
