# Q_Alpha v5 standalone engine configuration
# Data provider: Massive.com (ex-Polygon). Override key via MASSIVE_API_KEY.

massive_api_key: "Zs2ZeVDXsn8zS3jPO6yDDL3CDQHbaO9r"  # override with env MASSIVE_API_KEY preferred
massive_base_url: "https://api.massive.com"

start_date: "2010-01-01"
end_date: null  # null => today
initial_cash: 50000000

universe_limit: null          # ignored (legacy; do not use)
# Test mode: after full NASDAQ pull, randomly keep N active tickers for profiles/prices/funds.
# Set to null for the full universe (~4k+ active / ~11k with delisted).
universe_sample_size: 500
universe_sample_seed: 42
benchmark: QQQ

# Parallel downloaders (profiles / prices / optional fundamentals). Shared rate limiter.
# Raise workers or lower interval for more speed; back off if you see many 429s.
download_workers: 8
request_interval_sec: 0.08
max_retries: 3
# CMVS v3 does not use PIT fundamentals — leave false unless you need legacy screens.
download_fundamentals: false
# Max quarterly statements to pull per ticker from Massive financials
statement_limit: 100

max_portfolio_size: 20
selection_buffer_size: 30
# Aggressive test: raised from 0.20 (revert if MDD too high)
max_industry_weight: 0.40
min_industry_size: 8
# Entry quality hard filters (reject penny / extreme-vol / collapsed / failed-spike names)
min_entry_price: 3.0
max_atr_pct_entry: 0.15
max_spike_5d: 0.35
min_close_vs_high20: 0.60
# CMVS quality weights (tilted toward relative strength / structure)
cmvs_w1: 0.10   # BBS (damped after spikes)
cmvs_w2: 0.10   # VZS (requires rising price)
cmvs_w3: 0.15   # CPS
cmvs_w4: 0.10   # RSIS mid-zone quality
cmvs_w5: 0.25   # RSS relative strength
# Entry Quality Score (EQS) — blended into live final_score with CMVS
eqs:
  blend_weight: 0.55          # FinalScore = CMVS + blend_weight * EQS
  trend_structure: 0.28
  healthy_pullback: 0.14
  volume_contraction_expansion: 0.12
  volatility_contraction: 0.12
  rs_acceleration: 0.14
  sector_strength: 0.10
  overextension_penalty_scale: 0.35
# Confirmation-based trend exit (EMA9 alone never sells; ATR remains primary)
high_atr_pct_exit: 0.08
trend_exit_min_confirm: 2
trend_exit_min_confirm_high_vol: 3
protect_healthy_trend_pullback: true
vol_floor: 1.0e-4
weight_sum_tolerance: 0.02
lowvol_window: 60
mom_window: 252
corr_window: 60
# Aggressive test: raised from 0.80 (allow more similar names; revert if MDD too high)
corr_threshold: 0.95
flat_tax_rate: 0.21

silent_delist_recovery: 0.30
silent_delist_gap_days: 10

top_adv_pool: 250
participation_cap_buy: 0.08
participation_cap_sell: 0.15

# Trading costs deducted on every buy/sell during rebalance fills
commission_rate: 0.0005  # 0.05%
slippage_rate: 0.0002    # 0.02%

# Universe filters in get_universe (loosened; missing metrics do not reject)
min_roic: 0.03               # was 0.10 — ROIC must exceed 3% when available
min_fcf_sales_yield: -0.05   # was 0.0 — allow mildly negative FCF/Sales
max_debt_to_equity: 3.0      # was 1.50 — D/E must be below 300% when available
min_revenue_growth_yoy: -0.15  # was 0.0 — allow up to -15% YoY revenue change

# Legacy % trailing stop (unused by CMVS v3; exits use atr_multiplier / EMA9 / RSI)
# trailing_stop_pct: 0.20
atr_multiplier: 2.0        # CMVS: sell if close < peak_close - atr_multiplier * ATR(14)

# Research Configuration Panel — Institutional Event-Driven Rebalancing.
# Edit these values for experiments — no code changes required.
# Buy band (ENTRY_RANK) is independent of portfolio capacity (MAX_PORTFOLIO_SIZE).
research:
  # Entry engine: academic Institutional multi-factor (not CMVS)
  USE_INSTITUTIONAL_ENTRY: true

  # Event-driven rank buffer (hysteresis):
  #   Buy only Rank ≤ 10; Hold while Rank ≤ 30; Sell if Rank > 30.
  # Do not replace a holding merely because another name ranks slightly higher.
  ENTRY_RANK: 10              # new-entry band (Top 10)
  EXIT_RANK: 30               # hold buffer; forced rank exit when rank > 30

  # EMA / confirmed trend exit (USE_EMA9_EXIT name kept for UI)
  # Single EMA9 pierce never sells — multi-signal confirmation required.
  USE_EMA9_EXIT: true
  EMA_EXIT_LENGTH: 9          # short EMA used inside confirmation logic

  # ATR
  USE_ATR_EXIT: true
  ATR_MULTIPLIER: 2.0

  # Exhaustion
  USE_EXHAUSTION_EXIT: true

  # Time Stop
  USE_TIME_STOP: false
  TIME_STOP_DAYS: 20

  # Intraday hard stop from entry (Low triggers; fill = min(Open, stop))
  USE_STOP_LOSS: true
  STOP_LOSS_PCT: 0.15         # 0.0–0.50; if Low <= entry×(1−pct) → sell same day

  # Holding
  MIN_HOLD_DAYS: 0

  # Portfolio capacity (refill vacant slots from Top ENTRY_RANK only)
  MAX_PORTFOLIO_SIZE: 20

  # Rebalance
  MONTHLY_REBALANCE: true

  # Risk
  MAX_INDUSTRY_WEIGHT: 0.40

  # Observation tooling (does not affect trades)
  SHADOW_HORIZON_DAYS: 20

# Volatility expansion is scored in rank_universe as (close-open)/ATR20
# (vol_breakout_atr_mult kept unused; was the old hard filter threshold)
vol_breakout_atr_mult: 1.5

# Breakout candidate screener (Streamlit "Screener" tab / run_breakout_screener.py)
# Uses already-downloaded local panels only — does not re-download.
breakout_screener:
  ema_period: 30                 # EMA length for the fresh upward cross
  resistance_lookback: 60        # Bars used to form horizontal resistance (prior highs)
  volume_avg_window: 20          # Average volume lookback
  volume_threshold: 1.5          # Require volume >= threshold × average
  max_breakout_age: 5            # Breakout must be within this many sessions
  max_breakout_separation: 3     # |EMA age − resistance age| must be ≤ this
  max_extension_pct: 0.05        # Exclude names already >5% above resistance
  min_history_bars: 80           # Minimum bars of history required per ticker

# Live / near-live Massive snapshots + incremental daily catch-up
# Snapshots require a Massive plan that includes Snapshot (Starter+).
# True realtime (not 15-min delayed) needs Stocks Advanced / Business.
realtime:
  snapshot_batch_size: 50
  merge_into_panels: true        # Upsert today's live day bar into panels.pkl
  incremental_lookback_days: 7   # Days re-fetched on --mode incremental

paths:
  prices: data/prices
  fundamentals: data/fundamentals
  metadata: data/metadata
  cache: cache
  massive_cache: cache/massive_cache
